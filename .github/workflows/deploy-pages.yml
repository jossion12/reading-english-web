# =============================================================================
# 前端发布到 GitHub Pages
#
# 触发：推送到 main / 每天定时刷新文章快照 / 手动触发
# 产物：Reading-Web-Frontend/dist → GitHub Pages
#
# 必配 Secrets（仓库 → Settings → Secrets and variables → Actions）：
#   VITE_SUPABASE_URL        在线 Supabase 项目地址，如 https://xxxx.supabase.co
#   VITE_SUPABASE_ANON_KEY   publishable / anon 密钥（绝不能放 service_role）
#
# 可选 Variables：
#   VITE_BASE_PATH           自定义域名时留空；普通 <user>.github.io/<repo>/ 部署
#                            留空即可，工作流会用仓库名自动推导
#
# 关于 articles.json：构建时用 anon 密钥把已发布文章导出成同域静态快照，
# 浏览器首屏只读它。国内手机网络常连不上 *.supabase.co（Failed to fetch），
# 直连 Supabase 退为「能连上时」的后台增强。每日定时触发是为了让快照
# 跟上每天新生成的文章，不必每次手工 push 一次。
# =============================================================================

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Reading-Web-Frontend/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # UTC 12:30 = 北京 20:30，刷新当天新增文章的快照
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只跑一次，排队中的旧任务直接取消
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 让 vite 的 base 自动推导成 /<repo>/
  VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启用 GitHub Pages
        # 首次推送时自动把 Pages 建起来（Source = GitHub Actions），
        # 不必再去 Settings → Pages 手动选一次
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Reading-Web-Frontend/package-lock.json

      - name: 安装依赖
        working-directory: Reading-Web-Frontend
        run: npm ci

      - name: 类型检查
        working-directory: Reading-Web-Frontend
        run: npm run typecheck

      - name: 构建（含文章快照导出）
        working-directory: Reading-Web-Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 校验文章快照
        # 缺快照时前端会退回直连 Supabase，国内手机又会变成「0 篇 + Failed to fetch」。
        # 宁可让这次部署失败，也不要发一个读不到文章的版本。
        run: |
          test -s Reading-Web-Frontend/dist/articles.json || {
            echo "::error::dist/articles.json 缺失或为空，请检查 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY Secrets";
            exit 1;
          }
          echo "快照校验通过：$(wc -c < Reading-Web-Frontend/dist/articles.json) 字节"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: Reading-Web-Frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
