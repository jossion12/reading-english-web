# SearXNG 实例配置（本地元搜索）
# 关键：formats 里必须包含 json，采集服务的 /search?q=...&format=json 才能拿到结构化结果
use_default_settings: true

general:
  instance_name: "Reading Search"
  debug: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "reading-english-web-local-searxng-secret"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

ui:
  static_use_hash: true

# --- 引擎选择 -------------------------------------------------------------
# 本地网络环境下，海外新闻引擎（duckduckgo / google / brave / qwant…）会超时，
# 因此显式启用国内可达的引擎，并关闭不可达的那些。
engines:
  - name: bing news
    disabled: false
  - name: baidu
    disabled: false
    categories: [general, news]
  - name: sogou
    disabled: false
    categories: [general, news]
  - name: 360search
    disabled: false
    categories: [general, news]

  # sogou wechat 返回的是跳转链接（weixin.sogou.com），既不在白名单内又拖慢响应，默认关闭
  - name: sogou wechat
    disabled: true

  - name: duckduckgo news
    disabled: true
  - name: google news
    disabled: true
  - name: brave.news
    disabled: true
  - name: qwant news
    disabled: true
  - name: fireball news
    disabled: true
  - name: tusksearch news
    disabled: true
  - name: wikinews
    disabled: true
  - name: naver news
    disabled: true
  - name: ansa
    disabled: true
  - name: tagesschau
    disabled: true
  - name: il post
    disabled: true
  - name: reuters
    disabled: true
