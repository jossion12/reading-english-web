# 本地依赖服务：SearXNG（元搜索）+ 可选 Crawl4AI（网页清洗）
#
#   docker compose -f deploy/docker-compose.yml up -d searxng
#
# 只监听 127.0.0.1，不暴露公网。
services:
  searxng:
    image: searxng/searxng:latest
    container_name: reading-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  # 可选：需要真正用 Crawl4AI 清洗时才启动。
  # 未启动时采集服务会自动降级到内置提取器（CRAWLER_MODE=auto）。
  # crawl4ai:
  #   image: unclecode/crawl4ai:latest
  #   container_name: reading-crawl4ai
  #   restart: unless-stopped
  #   shm_size: 1gb
  #   ports:
  #     - "127.0.0.1:11235:11235"
  #   environment:
  #     - CRAWL4AI_API_TIMEOUT=120
