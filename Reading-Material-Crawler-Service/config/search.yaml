# ===========================================================================
# 检索配置（PRD §2.1 / §2.2 / §4.3）—— 主题、Query 模板、白名单、黑名单均可配置
# ===========================================================================

# --- 四大主题 + 预设搜索 Query ---------------------------------------------
# {keyword} 会被调用方传入的核心关键词替换；未提供时直接使用整条模板
themes:
  人与自我:
    description: 学生成长、自律、责任、情绪与兴趣
    queries:
      - "{keyword} 学生 成长 坚持"
      - "{keyword} 中学生 自我 感悟"
      - "{keyword} 少年 责任 习惯"
    keywords:
      - 学生
      - 青少年
      - 中学生
      - 成长
      - 坚持

  人与社会:
    description: 邻里互助、公共空间、规则公德、传统文化
    queries:
      - "{keyword} 社区 邻里 互助"
      - "{keyword} 志愿者 服务 温暖"
      - "{keyword} 传统 节日 文化 传承"
    keywords:
      - 社区
      - 志愿者
      - 邻里
      - 公益
      - 文化

  人与自然:
    description: 生态保护、气候行动、生物与能源
    queries:
      - "{keyword} 生态 保护 修复"
      - "{keyword} 环保 绿色 低碳"
      - "{keyword} 植物 动物 保护"
    keywords:
      - 生态
      - 环保
      - 绿色
      - 保护
      - 气候

  人与科技:
    description: 科普实验、AI 日常、智能制造与探索
    queries:
      - "{keyword} 科普 实验 学生"
      - "{keyword} 人工智能 生活 应用"
      - "{keyword} 科技 创新 青少年"
    keywords:
      - 科普
      - 科技
      - 人工智能
      - 创新
      - 实验

# --- 搜索时间范围 ----------------------------------------------------------
time_ranges:
  day:
    label: 今日
    searxng: day
  week:
    label: 近一周
    searxng: week
  month:
    label: 近一月
    searxng: month

# --- 域名白名单（正向媒体，PRD §2.1）-------------------------------------
# 后缀匹配：news.cctv.com 命中 cctv.com
domain_whitelist:
  - news.cn
  - xinhuanet.com
  - people.com.cn
  - cctv.com
  - chinadaily.com.cn
  - chinadaily.com
  - 21stcentury.com.cn
  - cyol.com
  - gmw.cn
  - ce.cn
  - stdaily.com
  - chinanews.com.cn      # 中新网（注意是 .com.cn，chinanews.com 匹配不到）
  - chinanews.com
  - cnr.cn                # 央广网
  - workercn.cn           # 工人日报
  - yicai.com
  - thepaper.cn

# --- 关键词黑名单（命中标题或摘要即过滤，PRD §2.1）----------------------
# 默认偏保守；可按需增补，命中任意一条即丢弃该候选
blacklist_keywords:
  - 事故
  - 灾难
  - 死亡
  - 遇难
  - 坠毁
  - 爆炸
  - 火灾
  - 地震
  - 洪水
  - 台风
  - 疫情
  - 犯罪
  - 判刑
  - 逮捕
  - 冲突
  - 战争
  - 袭击
  - 虐待
  - 伤害
  - 自杀
  - 坠亡
  - 塌陷
  - 爆炸事故
  - 遇难者
  - 失联
  - 遗体
  - 死者
  - 伤亡
  - 追责
  - 处罚
  - 骗
  - 谣言

# --- 候选结果过滤 ----------------------------------------------------------
filters:
  min_title_length: 8
  max_results: 30
  # 摘要为空时是否保留该候选（true=保留，仅靠标题判断黑名单）
  keep_without_summary: true

# --- RSS 直采源（检索兜底通道，PRD §2.8）------------------------------------
# SearXNG 只是元搜索入口，真正出结果的是它背后的上游引擎。本机实测容器出口下
# baidu/sogou/duckduckgo/brave/google cse 全部失效，bing 与 360 返回 0 条，
# 检索拿不到任何候选。以下白名单媒体自带的 RSS 频道实测当天更新，作为兜底。
# 域名天然落在 domain_whitelist 内，因此不需要额外放行。
rss_sources:
  - name: 中新网·滚动新闻
    url: https://www.chinanews.com.cn/rss/scroll-news.xml
  - name: 中新网·国内新闻
    url: https://www.chinanews.com.cn/rss/china.xml
  - name: 中新网·重要新闻
    url: https://www.chinanews.com.cn/rss/importnews.xml
  - name: 中新网·社会
    url: https://www.chinanews.com.cn/rss/society.xml
  - name: 中新网·财经
    url: https://www.chinanews.com.cn/rss/finance.xml
  - name: 中新网·国际
    url: https://www.chinanews.com.cn/rss/world.xml
  - name: 中新网·健康
    url: https://www.chinanews.com.cn/rss/health.xml
  - name: 中新网·教育
    url: https://www.chinanews.com.cn/rss/edu.xml
  - name: 中新网·体育
    url: https://www.chinanews.com.cn/rss/sports.xml
